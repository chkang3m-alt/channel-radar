<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Channel Radar</title>
<style>
  :root{
    --ground:#EDEFF3; --surface:#FFFFFF; --surface-2:#F5F7FA;
    --ink:#161A20; --ink-2:#3D454F; --muted:#69727F;
    --line:#DBE0E7; --line-soft:#E8ECF1;
    --signal:#B23425; --warn:#A8630F;
    --shadow:0 1px 2px rgba(20,26,34,.05), 0 4px 16px rgba(20,26,34,.06);
    --ch-daiso:#B23425; --ch-gt:#1F6F52; --ch-hyper:#2A5CA0;
    --ch-office:#6B4A96; --ch-hnb:#A8630F; --ch-ecom:#2A5CA0;
    --sans:"Pretendard","Apple SD Gothic Neo",-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
    --mono:"Cascadia Mono",Consolas,"SF Mono",ui-monospace,"D2Coding",monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#0E1116; --surface:#161A21; --surface-2:#1D222A;
      --ink:#E7EAEF; --ink-2:#B6BDC8; --muted:#848D9B;
      --line:#272E38; --line-soft:#1F252D;
      --signal:#E46854; --warn:#D6912F;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.35);
      --ch-daiso:#E46854; --ch-gt:#54A386; --ch-hyper:#6592D6;
      --ch-office:#A183CC; --ch-hnb:#D6912F; --ch-ecom:#6592D6;
    }
  }
  :root[data-theme="dark"]{
    --ground:#0E1116; --surface:#161A21; --surface-2:#1D222A;
    --ink:#E7EAEF; --ink-2:#B6BDC8; --muted:#848D9B;
    --line:#272E38; --line-soft:#1F252D;
    --signal:#E46854; --warn:#D6912F;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.35);
    --ch-daiso:#E46854; --ch-gt:#54A386; --ch-hyper:#6592D6;
    --ch-office:#A183CC; --ch-hnb:#D6912F; --ch-ecom:#6592D6;
  }

  *{box-sizing:border-box}
  body{margin:0; background:var(--ground); color:var(--ink);
    font-family:var(--sans); font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased}
  .wrap{max-width:940px; margin:0 auto; padding:0 20px 72px}

  header{position:sticky; top:0; z-index:20;
    background:color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter:blur(12px); border-bottom:1px solid var(--line)}
  .bar{max-width:940px; margin:0 auto; padding:14px 20px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:10px; margin-right:auto}
  .brand h1{margin:0; font-size:17px; font-weight:700; letter-spacing:-.01em}
  .brand .dot{width:7px; height:7px; border-radius:50%; background:var(--signal); flex:none}
  .datenav{display:flex; align-items:center; gap:2px}
  .datenav .d{font-family:var(--mono); font-size:12.5px; font-variant-numeric:tabular-nums;
    padding:0 10px; color:var(--ink-2); white-space:nowrap}
  .langtog{display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden}
  .langtog button{border:0; background:var(--surface); color:var(--muted); cursor:pointer;
    font-family:var(--mono); font-size:11.5px; font-weight:600; padding:5px 11px; letter-spacing:.04em}
  .langtog button[aria-pressed="true"]{background:var(--ink); color:var(--ground)}

  .funnel{display:grid; grid-template-columns:repeat(4,1fr); gap:1px;
    background:var(--line-soft); border:1px solid var(--line);
    border-radius:10px; overflow:hidden; margin:22px 0 6px}
  .fstep{background:var(--surface); padding:12px 14px}
  .fstep .lab{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted); display:block; margin-bottom:3px}
  .fstep .num{font-family:var(--mono); font-size:22px; font-weight:600;
    font-variant-numeric:tabular-nums; letter-spacing:-.02em}
  .fstep .num small{font-size:12px; font-weight:400; color:var(--muted); margin-left:3px}
  .fstep:last-child .num{color:var(--signal)}
  .fnote{font-size:12.5px; color:var(--muted); margin:0 0 12px; padding-left:2px}
  .banner{margin:0 0 24px; padding:11px 14px; border-left:3px solid var(--warn);
    background:var(--surface); border-radius:0 8px 8px 0; font-size:12.5px; color:var(--ink-2)}
  .banner b{color:var(--ink)}

  .tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:22px}
  .tabs button{border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
    border-radius:999px; padding:5px 13px; cursor:pointer; font-family:inherit;
    font-size:13px; display:inline-flex; align-items:center; gap:6px}
  .tabs button[aria-pressed="true"]{background:var(--ink); color:var(--ground); border-color:var(--ink)}
  .tabs button[data-empty="1"]{opacity:.42}
  .tabs .cnt{font-family:var(--mono); font-size:11px; font-variant-numeric:tabular-nums; opacity:.65}

  .seclab{display:flex; align-items:center; gap:10px; margin:0 0 12px;
    font-family:var(--mono); font-size:11px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted)}
  .seclab::after{content:""; flex:1; height:1px; background:var(--line)}
  .seclab.a{color:var(--signal)}
  .seclab.a::after{background:color-mix(in srgb,var(--signal) 30%,var(--line))}
  .seclab.mt{margin-top:30px}

  .cards{display:flex; flex-direction:column; gap:14px}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow); overflow:hidden; display:grid; grid-template-columns:196px 1fr}
  .card.hide{display:none}
  .card.tA{border-color:color-mix(in srgb,var(--signal) 38%,var(--line))}

  .thumb{position:relative; background:var(--surface-2);
    border-right:1px solid var(--line-soft);
    display:flex; flex-direction:column; justify-content:space-between;
    padding:12px; min-height:147px; overflow:hidden}
  .thumb::before{content:""; position:absolute; inset:0;
    background:
      linear-gradient(135deg, color-mix(in srgb,var(--c) 16%,transparent) 0%, transparent 62%),
      repeating-linear-gradient(90deg, color-mix(in srgb,var(--c) 7%,transparent) 0 1px, transparent 1px 13px)}
  .thumb > *{position:relative}
  .thumb .code{font-family:var(--mono); font-size:10.5px; font-weight:700;
    letter-spacing:.1em; color:var(--c)}
  .thumb .glyph{font-family:var(--mono); font-size:38px; font-weight:600; line-height:1;
    color:var(--c); opacity:.5; letter-spacing:-.04em}
  .thumb .ph{font-size:10.5px; color:var(--muted)}

  .thumb.has-img{padding:0; display:block}
  .thumb.has-img::before{display:none}
  .thumb.has-img img{position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; display:block}
  .thumb.has-img .code{position:absolute; left:8px; bottom:7px; z-index:2;
    background:rgba(10,12,16,.72); color:#fff; padding:2px 6px; border-radius:4px}
  .thumb.has-img .code.alt{background:rgba(10,12,16,.62); font-style:italic; opacity:.9}
  .rel.alt{border-style:solid; border-color:var(--warn); color:var(--warn)}

  .body{padding:15px 17px 13px; min-width:0}
  .meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:7px;
    font-family:var(--mono); font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
  .score{display:inline-flex; align-items:center; gap:4px; border:1px solid var(--line);
    border-radius:5px; padding:1px 6px; color:var(--ink-2); font-weight:600}
  .score b{color:var(--signal)}
  .tier{font-weight:700; border-radius:4px; padding:1px 6px; letter-spacing:.06em}
  .tier.A{background:var(--signal); color:#fff}
  .tier.B{background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line)}
  .tag{background:var(--surface-2); border-radius:4px; padding:1px 6px; color:var(--ink-2)}
  h2{margin:0 0 9px; font-size:16.5px; line-height:1.4; font-weight:700;
    letter-spacing:-.012em; text-wrap:balance}
  .bul{list-style:none; margin:0 0 11px; padding:0; display:flex; flex-direction:column; gap:5px}
  .bul li{display:grid; grid-template-columns:112px 1fr; gap:10px;
    font-size:13.5px; line-height:1.55; color:var(--ink-2)}
  .bul .k{font-family:var(--mono); font-size:10px; letter-spacing:.02em; color:var(--muted);
    padding-top:3px; text-transform:uppercase}
  .bul li.us{color:var(--ink)}
  .bul li.us .k{color:var(--signal); font-weight:700}
  .bul li.us .v{font-weight:600}

  .foot{display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding-top:10px; border-top:1px solid var(--line-soft)}
  .src{font-size:12px; color:var(--muted); margin-right:auto}
  a.orig{color:var(--signal); text-decoration:none; font-size:12.5px; font-weight:600;
    border-bottom:1px solid color-mix(in srgb,var(--signal) 35%,transparent)}
  a.orig:hover{border-bottom-color:var(--signal)}
  .fb{display:flex; gap:4px}
  .fb button{border:1px solid var(--line); background:var(--surface); border-radius:6px;
    width:28px; height:26px; cursor:pointer; font-size:12px; line-height:1; color:var(--ink-2)}
  .fb button[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--ground)}
  .rel{font-family:var(--mono); font-size:11px; color:var(--muted);
    border:1px dashed var(--line); border-radius:5px; padding:1px 6px}

  details.log{margin-top:30px; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; overflow:hidden}
  details.log summary{cursor:pointer; padding:13px 17px; font-size:13.5px; font-weight:600;
    display:flex; align-items:center; gap:9px; list-style:none}
  details.log summary::-webkit-details-marker{display:none}
  details.log summary::before{content:"\\25B8"; color:var(--muted); font-size:11px}
  details.log[open] summary::before{content:"\\25BE"}
  details.log summary .n{font-family:var(--mono); font-size:11px; color:var(--muted); margin-left:auto}
  .tblwrap{overflow-x:auto; border-top:1px solid var(--line-soft)}
  table{border-collapse:collapse; width:100%; min-width:560px; font-size:12.5px}
  th,td{text-align:left; padding:8px 12px; border-bottom:1px solid var(--line-soft); vertical-align:top}
  th{font-family:var(--mono); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase;
    color:var(--muted); font-weight:600; background:var(--surface-2)}
  td.v{font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--ink-2)}
  td .t{display:inline-block; font-family:var(--mono); font-size:10px; font-weight:700;
    border-radius:4px; padding:1px 5px; margin-right:6px;
    background:var(--surface-2); border:1px solid var(--line)}
  .t.C{color:var(--warn)} .t.D{color:var(--muted)}
  td.why{color:var(--muted)}
  details.shortlist{margin-top:26px}
  details.shortlist summary{color:var(--ink)}
  a.slink{color:var(--ink); text-decoration:none; font-weight:600; font-size:13px}
  a.slink:hover{color:var(--signal); text-decoration:underline}
  .tblwrap .why{color:var(--muted); font-size:11.5px; line-height:1.45; padding-top:3px}

  footer{margin-top:34px; padding-top:16px; border-top:1px solid var(--line);
    font-size:12px; color:var(--muted); line-height:1.7}
  .empty{padding:26px 20px; text-align:center; color:var(--muted); font-size:13.5px;
    border:1px dashed var(--line); border-radius:12px; display:none}

  :focus-visible{outline:2px solid var(--signal); outline-offset:2px; border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  @media (max-width:620px){
    .card{grid-template-columns:1fr}
    .thumb{min-height:0; flex-direction:row; align-items:center; gap:12px;
      border-right:0; border-bottom:1px solid var(--line-soft); padding:10px 14px}
    .thumb.has-img{height:150px; padding:0}
    .thumb .glyph{font-size:24px}
    .thumb .ph{margin-left:auto}
    .funnel{grid-template-columns:repeat(2,1fr)}
    .bul li{grid-template-columns:1fr; gap:1px}
    .bul .k{padding-top:0}
  }
</style>

<header>
  <div class="bar">
    <div class="brand"><span class="dot"></span><h1>Channel Radar</h1></div>
    <div class="datenav"><span class="d" id="dlabel">2026-09-03 THU</span></div>
    <div class="langtog" role="group" aria-label="언어 전환">
      <button type="button" data-lang="ko" aria-pressed="true">KO</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="funnel">
    <div class="fstep"><span class="lab" data-ko="수집" data-en="Collected">수집</span><span class="num">0</span></div>
    <div class="fstep"><span class="lab" data-ko="중복제거" data-en="Deduped">중복제거</span><span class="num">0<small>&minus;0</small></span></div>
    <div class="fstep"><span class="lab" data-ko="필터 통과" data-en="Passed">필터 통과</span><span class="num">0<small>/0</small></span></div>
    <div class="fstep"><span class="lab" data-ko="발행" data-en="Published">발행</span><span class="num">0<small>/10</small></span></div>
  </div>
  <p class="fnote" data-ko="A티어 0건 · B티어 0건. 상한 10건 중 0건 — 남은 자리는 비워 둡니다. 수집 창 2026-09-02." data-en="0 A-tier, 0 B-tier. 0 of a 10-slot cap — remaining slots stay empty. Window 2026-09-02.">A티어 0건 · B티어 0건. 상한 10건 중 0건 — 남은 자리는 비워 둡니다. 수집 창 2026-09-02.</p>


  <div class="tabs" role="group" aria-label="채널 필터">
    <button type="button" data-ch="all" aria-pressed="true"><span data-ko="전체" data-en="All">전체</span><span class="cnt">0</span></button>
    <button type="button" data-ch="OFFICE" aria-pressed="false" data-empty="1"><span data-ko="Office" data-en="Office">Office</span><span class="cnt">0</span></button>
    <button type="button" data-ch="DAISO" aria-pressed="false" data-empty="1"><span data-ko="Daiso" data-en="Daiso">Daiso</span><span class="cnt">0</span></button>
    <button type="button" data-ch="GT" aria-pressed="false" data-empty="1"><span data-ko="GT·슈퍼" data-en="GT">GT·슈퍼</span><span class="cnt">0</span></button>
    <button type="button" data-ch="MART" aria-pressed="false" data-empty="1"><span data-ko="마트·창고형" data-en="Mart">마트·창고형</span><span class="cnt">0</span></button>
    <button type="button" data-ch="CVS" aria-pressed="false" data-empty="1"><span data-ko="편의점" data-en="CVS">편의점</span><span class="cnt">0</span></button>
    <button type="button" data-ch="HNB" aria-pressed="false" data-empty="1"><span data-ko="H&amp;B·약국" data-en="H&amp;B">H&amp;B·약국</span><span class="cnt">0</span></button>
    <button type="button" data-ch="ECOM" aria-pressed="false" data-empty="1"><span data-ko="이커머스" data-en="eCommerce">이커머스</span><span class="cnt">0</span></button>
    <button type="button" data-ch="ETC" aria-pressed="false" data-empty="1"><span data-ko="철물·OEM" data-en="Hardware">철물·OEM</span><span class="cnt">0</span></button>
  </div>

  <div class="cards" id="cards">
<p class="empty" style="display:block" data-ko="오늘 기준을 통과한 기사가 없습니다." data-en="Nothing cleared the bar today.">오늘 기준을 통과한 기사가 없습니다.</p>
  </div>

  <p class="empty" id="empty" data-ko="이 채널은 발행 기사가 없습니다." data-en="No published items for this channel.">이 채널은 발행 기사가 없습니다.</p>





  <footer>
    <span data-ko="LLM 채점 · claude-haiku-4-5-20251001 · 네이버 뉴스 검색 API + 구글 뉴스 RSS · 생성 2026-09-03 08:08"
          data-en="LLM scoring · claude-haiku-4-5-20251001 · Naver News Search API + Google News RSS · generated 2026-09-03 08:08">LLM 채점 · claude-haiku-4-5-20251001 · 네이버 뉴스 검색 API + 구글 뉴스 RSS · 생성 2026-09-03 08:08</span><br>
    <span data-ko="기사 요약은 원문 재작성이며 전재가 아닙니다. 판단은 원문을 확인하세요. 사내 열람용."
          data-en="Summaries are rewritten, not reproduced. Verify against the source before acting. Internal use only.">기사 요약은 원문 재작성이며 전재가 아닙니다. 판단은 원문을 확인하세요. 사내 열람용.</span>
  </footer>
</div>

<script>
(function(){
  // URL 로 언어를 지정할 수 있다 (?lang=en 또는 #en).
  // 메일에는 자바스크립트가 없으므로, 영문 독자는 이 링크로 대시보드를 연다.
  var forced = null;
  try {
    var qs = new URLSearchParams(location.search);
    if (qs.get('lang') === 'en' || location.hash === '#en') forced = 'en';
    if (qs.get('lang') === 'ko' || location.hash === '#ko') forced = 'ko';
  } catch (e) {}
  var lang = forced || localStorage.getItem('cr-lang') || 'ko';
  function applyLang(l){
    lang = l;
    localStorage.setItem('cr-lang', l);
    document.querySelectorAll('[data-ko]').forEach(function(el){
      var v = el.getAttribute('data-' + l);
      if (v) el.textContent = v;
    });
    document.querySelectorAll('.langtog button').forEach(function(b){
      b.setAttribute('aria-pressed', String(b.dataset.lang === l));
    });
    var d = document.getElementById('dlabel');
    d.textContent = (l === 'ko') ? '2026-09-03 THU' : 'THU 2026-09-03';
  }
  document.querySelectorAll('.langtog button').forEach(function(b){
    b.addEventListener('click', function(){ applyLang(b.dataset.lang); });
  });
  applyLang(lang);

  var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
  var labels = Array.prototype.slice.call(document.querySelectorAll('#cards .seclab'));
  var empty = document.getElementById('empty');
  document.querySelectorAll('.tabs button').forEach(function(btn){
    btn.addEventListener('click', function(){
      var ch = btn.dataset.ch;
      document.querySelectorAll('.tabs button').forEach(function(b){
        b.setAttribute('aria-pressed', String(b === btn));
      });
      var shown = 0;
      cards.forEach(function(c){
        var on = (ch === 'all' || c.dataset.ch === ch);
        c.classList.toggle('hide', !on);
        if (on) shown++;
      });
      labels.forEach(function(l){ l.style.display = (ch === 'all') ? '' : 'none'; });
      empty.style.display = shown ? 'none' : 'block';
    });
  });

  // 피드백은 localStorage 에 쌓아 두고 다음 실행에서 store.py 가 회수한다
  var FB = 'cr-feedback';
  var saved = JSON.parse(localStorage.getItem(FB) || '{}');
  document.querySelectorAll('.fb').forEach(function(group){
    var id = group.dataset.id;
    if (saved[id]) {
      var want = saved[id] > 0 ? 0 : 1;
      group.querySelectorAll('button')[want].setAttribute('aria-pressed','true');
    }
    group.querySelectorAll('button').forEach(function(b, i){
      b.addEventListener('click', function(){
        var was = b.getAttribute('aria-pressed') === 'true';
        group.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed','false'); });
        if (was) { delete saved[id]; }
        else { b.setAttribute('aria-pressed','true'); saved[id] = (i === 0) ? 1 : -1; }
        localStorage.setItem(FB, JSON.stringify(saved));
      });
    });
  });
})();
</script>
